<header
  class="d-flex border-bottom py-0 px-0 align-items-center justify-content-between header-layout"
  th:fragment="header"
>
  <div id="logo">
    <a th:href="@{/}" class="text-decoration-none">
      <img
        th:src="@{/img/logo-hubgreen-compacto.png}"
        alt="HubGreen - Venha se conectar"
        class="logo-layout"
      />
    </a>
  </div>
  <div id="usuario">
    <div class="d-none d-sm-flex">
      <span>User</span>
      <button
        type="button"
        class="btn btn-link dropdown-toggle dropdown-toggle-split"
        data-bs-toggle="dropdown"
        aria-expanded="false"
      >
        <span class="visually-hidden">Toggle Dropdown</span>
      </button>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="#">Sair</a></li>
      </ul>
    </div>
    <div class="d-sm-none">
      <a class="btn btn-menu" data-bs-toggle="offcanvas" href="#offcanvas-nav">
        <i class="bi bi-list"></i>
      </a>
    </div>
  </div>
</header>
